<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Mframapa</title>
</head>
<body style="margin:0;padding:0;background:#0B0F14;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0B0F14;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:520px;background:#171E28;border-radius:20px;overflow:hidden;border:1px solid #25303C;">
          <tr>
            <td style="padding:36px 32px 8px;">
              <div style="font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#00C896;font-weight:700;">Mframapa</div>
              <h1 style="margin:12px 0 0;font-size:26px;line-height:1.25;color:#FFFFFF;">Welcome{{#if name}}, {{name}}{{/if}}</h1>
              <p style="margin:14px 0 0;font-size:15px;line-height:1.55;color:#9AA7B5;">
                Satellite-powered air quality for African cities. Check your place, save locations, and get clearer guidance on when to go outside.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 8px;" align="center">
              <a href="{{app_url}}"
                 style="display:inline-block;background:#00C896;color:#0B0F14;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px;">
                Open the app
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 36px;font-size:12px;line-height:1.5;color:#647182;">
              Estimates, not street-level measurements. For medical or official decisions, use government monitoring.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
