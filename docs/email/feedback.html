<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Mframapa feedback</title>
</head>
<body style="margin:0;padding:0;background:#0B0F14;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0B0F14;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px;background:#171E28;border-radius:16px;overflow:hidden;border:1px solid #25303C;">
          <tr>
            <td style="padding:28px 28px 12px;">
              <div style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#00C896;font-weight:700;">Mframapa</div>
              <h1 style="margin:10px 0 0;font-size:22px;line-height:1.3;color:#FFFFFF;">New in-app feedback</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 8px;">
              <table role="presentation" width="100%" style="font-size:14px;color:#9AA7B5;">
                <tr><td style="padding:6px 0;"><strong style="color:#FFFFFF;">Category</strong> · {{category}}</td></tr>
                <tr><td style="padding:6px 0;"><strong style="color:#FFFFFF;">Platform</strong> · {{platform}}</td></tr>
                <tr><td style="padding:6px 0;"><strong style="color:#FFFFFF;">Reply-to</strong> · {{email}}</td></tr>
                <tr><td style="padding:6px 0;"><strong style="color:#FFFFFF;">ID</strong> · #{{feedback_id}}</td></tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 28px;">
              <div style="background:#10161F;border:1px solid #25303C;border-radius:12px;padding:16px;color:#E8EEF4;font-size:15px;line-height:1.55;white-space:pre-wrap;">{{message}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;font-size:12px;color:#647182;">
              Stored in the feedback database even if delivery fails.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
