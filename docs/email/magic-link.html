<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Mframapa</title>
</head>
<body style="margin:0;padding:0;background:#F1F5F9;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F1F5F9;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:520px;background:#FFFFFF;border-radius:20px;overflow:hidden;border:1px solid #D4DAE3;">
          <tr>
            <td style="height:6px;background:linear-gradient(90deg,#00C896,#008060);"></td>
          </tr>
          <tr>
            <td style="padding:36px 32px 12px;">
              <div style="font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#008060;font-weight:700;">Mframapa</div>
              <h1 style="margin:12px 0 0;font-size:26px;line-height:1.25;color:#0F1419;">Your sign-in link</h1>
              <p style="margin:12px 0 0;font-size:15px;line-height:1.55;color:#5C6B7A;">
                Tap the button below to open Mframapa. This link expires soon and can be used once.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 8px;" align="center">
              <a href="{{confirmation_url}}"
                 style="display:inline-block;background:#00C896;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px;">
                Continue to Mframapa
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 36px;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#7B8A99;">
                If the button does not work, paste this URL into your browser:<br />
                <a href="{{confirmation_url}}" style="color:#008060;word-break:break-all;">{{confirmation_url}}</a>
              </p>
              <p style="margin:16px 0 0;font-size:12px;color:#7B8A99;">
                If you did not request this, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
