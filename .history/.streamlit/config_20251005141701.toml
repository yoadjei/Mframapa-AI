[server]
# Streamlit Cloud will override these automatically,
# but locally this will bind to localhost:8501
headless = false
address = "localhost"
port = 8501
enableCORS = false
enableXsrfProtection = true

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
