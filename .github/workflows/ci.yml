name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PREWARM_ON_START: "0"
      MFRAMAPA_INTERNAL_KEY: "test-internal-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q backend/tests/test_smoke.py
