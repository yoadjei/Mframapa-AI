# mframapa backend stack: nginx -> api (uvicorn) -> redis.
# tls is terminated upstream by cloudflare, so nginx serves plain http on :80.

# capped json logs so container logs can't fill the disk on a small box.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging

  api:
    build: .
    env_file: .env
    environment:
      # overrides whatever REDIS_URL is in .env — points at the compose redis service.
      REDIS_URL: redis://redis:6379
      WORKERS: "2"
      # durable sqlite (push subscriptions + analytics) lives on the mounted volume.
      MFRAMAPA_DATA_DIR: /data
    volumes:
      # swap in new model bundles without rebuilding the image.
      - ./ml/exports:/app/ml/exports:ro
      # survives container recreation / redeploys.
      - mframapa-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: always
    logging: *default-logging

volumes:
  redis-data:
  mframapa-data:
