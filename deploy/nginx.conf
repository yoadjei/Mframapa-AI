# reverse proxy in front of the uvicorn api. cloudflare terminates tls upstream.
# docker dns resolves "api" to every replica, so `--scale api=N` load-balances here.
upstream mframapa_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;      # batch predict bodies are small
    gzip on;
    gzip_types application/json application/geo+json text/csv;

    # unauthenticated container/LB probe.
    location = /api/health {
        proxy_pass http://mframapa_api;
        access_log off;
    }

    location / {
        proxy_pass http://mframapa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the continental map is warmed at startup, but leave headroom for a
        # cold rebuild rather than handing the user a 504.
        proxy_read_timeout 90s;

        # during a rolling restart, retry the next replica instead of returning 502.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
    }
}
