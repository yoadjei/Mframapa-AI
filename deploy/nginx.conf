# reverse proxy in front of the uvicorn api. cloudflare terminates tls upstream.
upstream mframapa_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;      # batch predict bodies are small
    gzip on;
    gzip_types application/json application/geo+json text/csv;

    # unauthenticated container/LB probe.
    location = /api/health {
        proxy_pass http://mframapa_api;
        access_log off;
    }

    location / {
        proxy_pass http://mframapa_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
